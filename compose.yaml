services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - data-network

  api:
    build:
      context: .
      dockerfile: ITServiceDesk.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ITServiceDeskDb;User Id=sa;Password=${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required};TrustServerCertificate=True;MultipleActiveResultSets=true"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      Database__AutoMigrate: "true"
      Proxy__ForwardedHeadersEnabled: "true"
      Proxy__TrustedNetwork: "172.25.0.0"
      Proxy__PrefixLength: "28"
      BootstrapAdmin__Enabled: "${BOOTSTRAP_ADMIN_ENABLED:-false}"
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
    volumes:
      - api-uploads:/app/App_Data/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - proxy-network
      - data-network

  frontend:
    build:
      context: ./ITServiceDesk.Client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/28
  data-network:
    driver: bridge

volumes:
  sqlserver-data:
  api-uploads:
